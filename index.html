<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="./program.js" defer></script>
    <link rel="stylesheet" href="style.css" />

    <title>Calculator</title>
</head>

<body>
    <div class="calculator-container">
        <h1>Currency Converter</h1>

        <div class="form-group">
            <label for="direction">Conversion Direction</label>
            <select id="direction">
                <option value="1">EUR to Foreign Currency</option>
                <option value="2">Foreign Currency to EUR</option>
            </select>
        </div>

        <div class="form-group">
            <label for="currency">Foreign Currency</label>
            <select id="currency">
                <option value="1">USD (US Dollar)</option>
                <option value="2">GBP (British Pound)</option>
            </select>
        </div>

        <div class="form-group">
            <label id="amount-label" for="amount">Amount to Convert</label>
            <input type="number" id="amount" placeholder="0.00" min="0" step="0.01" required>
        </div>

        <button id="convert-btn" type="button">Convert</button>

        <div id="result-display" class="result-box">
             0.00 EUR = 0.00 USD
        </div>
    </div>
</body>

</html>
