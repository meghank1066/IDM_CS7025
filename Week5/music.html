<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Playlist Generator</title>
  <link rel="stylesheet" href="music.css">
</head>
<body>

  <div class="container">
    <h1>select a category</h1>
    <p>choose a category to display its popular playlist:</p>

    <!-- category Option Buttons -->
    <div class="category-buttons">
      <button class="cat-btn active" onclick="showCategory('pop')">Pop</button>
      <button class="cat-btn" onclick="showCategory('rock')">Rock</button>
      <button class="cat-btn" onclick="showCategory('alt')">Alt</button>
      <button class="cat-btn" onclick="showCategory('slow')">Slow</button>
    </div>

    <!-- category Heading -->
    <h2 id="playlist-heading">Pop Playlist</h2>

    <!-- playlist Container -->
    <ul id="playlist" class="playlist">
      <!-- javaScript inserts list items here -->
    </ul>
  </div>

  <script src="index.js"></script>
</body>
</html>
